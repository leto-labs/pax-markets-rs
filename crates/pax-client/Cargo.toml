[package]
name = "pax-client"
description = "Public Pax metadata and WebSocket transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
pax-types.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
reqwest.workspace = true
futures-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
rtrb = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }

[features]
default = ["receive-timestamps", "receive-stages", "delivery-traces", "diagnostic-handoff"]
receive-timestamps = ["dep:nix"]
socket-readbacks = ["dep:nix"]
clock-model-details = ["receive-timestamps"]
phc-background = ["clock-model-details", "dep:rtrb"]
receive-association = []
receive-stages = ["receive-association"]
delivery-traces = []
diagnostic-handoff = ["dep:rtrb"]
# Ephemeral local TLS peer material, only used by offline tests/benchmarks.
test-support = ["dep:rcgen", "dep:blake3"]

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
pax-client = { path = ".", default-features = false, features = ["test-support"] }

[lints]
workspace = true
